# EpitopeRank Production Docker Compose for Coolify
# This file is optimized for self-hosted PaaS deployment

services:
  epitoperank-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epitoperank-api
    restart: unless-stopped
    ports:
      - "8800:8800"
    volumes:
      # Persist all data across deployments
      - epitoperank-data:/data
      # Mount environment file (managed by Coolify)
      - ./.env.production:/app/.env:ro
    environment:
      # Database paths
      - EPITOPERANK_RUNTIME_ROOT=/data/runtime
      - EPITOPERANK_MEMORY_DB=/data/epitoperank.sqlite3
      - EPITOPERANK_LITERATURE_DB=/data/literature.sqlite3
      # Feature flags
      - EPITOPERANK_ENABLE_PUBMED=true
      # LLM Configuration (set via Coolify environment variables)
      # DEEPSEEK_API_KEY, MOONSHOT_API_KEY, etc.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - epitoperank-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    labels:
      # Coolify-specific labels for automatic configuration
      - coolify.managed=true
      - coolify.applicationId=epitoperank
      - traefik.enable=true
      - traefik.http.routers.epitoperank.rule=Host(`epitoperank.your-domain.com`)
      - traefik.http.routers.epitoperank.tls=true
      - traefik.http.routers.epitoperank.tls.certresolver=letsencrypt
      - traefik.http.services.epitoperank.loadbalancer.server.port=8800

  # Optional: Nginx reverse proxy for better performance
  nginx:
    image: nginx:alpine
    container_name: epitoperank-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - epitoperank-api
    networks:
      - epitoperank-network
    profiles:
      - with-proxy  # Use this profile if you want Nginx

volumes:
  epitoperank-data:
    driver: local
    name: epitoperank-data
  nginx-logs:
    driver: local

networks:
  epitoperank-network:
    driver: bridge
