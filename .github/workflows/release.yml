name: EpitopeRank Release

# 自动发布 EpitopeRank 的 Windows 便携版。
# 触发方式：
#   1. 推送以 v 开头的 tag（如 v1.0.0）→ 自动打包并发布正式 Release
#   2. 在 Actions 页面手动 Run workflow → 仅构建验证（不发布，用于测试工作流）
# 构建与上传全部在 GitHub 云端完成，不依赖本地网络。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable (onedir)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (desktop_ui.py → EpitopeRank-Desktop.exe)
        run: |
          pyinstaller packaging\EpitopeRank-Desktop-OneFile.spec --distpath dist --workpath packaging\build-temp --noconfirm

      - name: Verify build output
        run: |
          if (!(Test-Path dist\EpitopeRank-Desktop.exe)) {
            Write-Error "EpitopeRank-Desktop.exe not found in dist/"
            exit 1
          }

      - name: Package portable ZIP
        run: |
          $zip = "EpitopeRank-${{ github.ref_name }}-windows.zip"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\EpitopeRank-Desktop.exe release\
          Copy-Item .env.example release\ -ErrorAction SilentlyContinue
          Copy-Item "配置大模型.env.example" release\ -ErrorAction SilentlyContinue
          Compress-Archive -Path "release\*" -DestinationPath $zip -Force
          Write-Host "Created $zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: epitoperank-windows
          path: EpitopeRank-${{ github.ref_name }}-windows.zip
          retention-days: 5

  release:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    # 仅在推送 v* tag 时发布；手动触发只做构建验证
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: epitoperank-windows
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: EpitopeRank ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## EpitopeRank ${{ github.ref_name }}

            Windows 便携版（免安装）。下载 `EpitopeRank-${{ github.ref_name }}-windows.zip`，
            解压后双击 `EpitopeRank-Desktop.exe` 即可启动本地服务并自动打开浏览器界面
            （地址形如 `http://127.0.0.1:8800/`）。无需安装 Python。

            ### 使用前配置
            - 发布版 **不包含任何 API 密钥**。
            - 想用 AI 解读或跑 HLA 预测时，在解压目录新建 `.env`（参考随包的 `.env.example`）：

              ```ini
              MODEL_API_BASE_URL=https://api.deepseek.com
              MODEL_API_KEY=sk-...
              MODEL_NAME=deepseek-flash
              ```

            - 不配置也能跑：自治内核用规则做决策，全流程照常完成，只是没有大模型叙述性解读。

            ### 快速上手
            见仓库内 [`docs/手把手教程.html`](https://github.com/Zhouhao-stak/EpitopeRank/blob/master/docs/%E6%89%8B%E6%8A%8A%E6%89%8B%E6%95%99%E7%A8%8B.html)。

            ### 说明
            - 构建由 GitHub Actions 在云端完成，产物与仓库源码一致。
            - 结果默认写入 `%LOCALAPPDATA%\EpitopeRank`，每个项目另导出一份成果文件夹到 `results\`。
            - 当前仅发布 Windows 版本；macOS / Linux 建议直接用源码或 Docker 运行。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
